<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Site</title>
    <link rel="stylesheet" href="/styles/global.css">
    <link rel="stylesheet" href="/styles/fonts.css">
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
</head>

<body>

  <!-- Hero image with the nav bar layered on top of it -->
  <div class="hero-wrapper">
    <img class="hero-image" src="images/Ethan-and-Ava.jpg" alt="Ethan preposing to Ava with Biltmore house in the background with A&E logo next to it"> 

    <header>
      <!-- Code assistance from https://www.w3schools.com/howto/tryit.asp?filename=tryhow_js_mobile_navbar -->
      <div class="topnav">
       

        <!-- Hamburger button (pure CSS bars, no icon font needed) -->
        <button class="hamburger" onclick="myFunction()" aria-label="Toggle navigation menu" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <!-- Navigation links (hidden by default) -->
        <div id="myLinks" class="nav-links">
          <a href="rsvp.html">RSVP</a>
          <a href="venue.html">Venue</a>
          <a href="about-us.html">About Us</a>
        </div>
      </div>
    </header>
  </div>

  <script>
  function myFunction() {
    var links = document.getElementById("myLinks");
    var btn = document.querySelector(".hamburger");
    var isOpen = links.style.display === "block";

    links.style.display = isOpen ? "none" : "block";
    btn.classList.toggle("open", !isOpen);
    btn.setAttribute("aria-expanded", String(!isOpen));
  }
  </script>

  <!-- Page content starts here, right after the hero image ends -->
  <main class="main-body">
    <div class="body-title">
      <h1>About Us</h1>
    </div>
    <div class="intro-paragraph">
      <p>About us page</p>
    </div>
  </main>

</body>
</html>
