<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Site</title>
    <link rel="stylesheet" href="/styles/global.css">
    <link rel="stylesheet" href="/styles/fonts.css">
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
</head>

<header>

  <div class="header-container">
    <div class="header-background-div">
      <img class="header-background" src="images/Ethan-and-Ava.jpg" alt="Ethan preposing to Ava with Biltmore house in the background with A&E logo next to it">
    </div>
      <!-- Code assistance from https://www.w3schools.com/howto/tryit.asp?filename=tryhow_js_mobile_navbar -->
      <div class="topnav">
        
        <!-- Hamburger button (pure CSS bars, no icon font needed) -->
        <button class="hamburger" onclick="myFunction()" aria-label="Toggle navigation menu" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <!-- Navigation links (hidden by default) -->
        <div id="myLinks" class="nav-links">
          <a href="rsvp.html">RSVP</a>
          <a href="venue.html">Venue</a>
          <a href="about-us.html">About Us</a>
        </div>
      </div>
  </div>



<script>
function myFunction() {
  var links = document.getElementById("myLinks");
  var btn = document.querySelector(".hamburger");
  var isOpen = links.style.display === "block";

  links.style.display = isOpen ? "none" : "block";
  btn.classList.toggle("open", !isOpen);
  btn.setAttribute("aria-expanded", String(!isOpen));
}
</script>

</header>

<body class="main-body">
  <div class="body-title">
    <h1>Ava and Ethan's Wedding</h1>
  </div>

  <div class="body-content">
    <p>Welcome to our wedding website! This site will contain all information you will need regarding the wedding! 
      Here you can find links to RSVP, important dates, venue details and more! 
    </p>
  </div>

</body>
</html>
